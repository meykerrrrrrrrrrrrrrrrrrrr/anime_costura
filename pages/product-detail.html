<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura — Detalle de Prenda</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        .product-detail-section {
            padding: 3rem 5%;
            min-height: 85vh;
        }
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.8rem;
            background: #111111;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            align-items: start;
        }
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .main-image-container {
            width: 100%;
            height: 480px;
            border-radius: 20px;
            overflow: hidden;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .main-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }
        .thumbnail-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px;
            scrollbar-width: thin;
        }
        .thumbnail-grid::-webkit-scrollbar {
            height: 4px;
        }
        .thumbnail-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        .product-info-detail h1 {
            font-size: 2.2rem;
            letter-spacing: -0.576px;
            color: #f5f5f7;
            margin-bottom: 0.5rem;
        }
        .price-tag {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f5f5f7;
            letter-spacing: -0.28px;
            margin-bottom: 1.2rem;
        }

        @media (max-width: 900px) {
            .product-detail-section {
                padding: 1.5rem 4%;
            }
            .product-detail-container {
                grid-template-columns: 1fr;
                padding: 1.5rem 1.2rem;
                gap: 24px;
                border-radius: 22px;
            }
            .main-image-container {
                height: 330px;
            }
            .product-info-detail h1 {
                font-size: 1.6rem;
            }
            .price-tag {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Anime<span>Costura</span></div>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="nosotros.html">Quiénes Somos</a></li>
                <li><a href="tienda.html" class="active">Tienda</a></li>
                <li><a href="inventario.html">Inventario</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="carrito.html" class="cart-nav-link">🛒 Carrito</a></li>
            </ul>
        </nav>
    </header>

    <!-- Fondo Ambiental -->
    <div class="anime-page-bg">
        <video autoplay muted loop playsinline webkit-playsinline preload="auto">
            <source src="../assets/media/video-hero.mp4" type="video/mp4">
        </video>
        <div class="anime-bg-overlay"></div>
    </div>

    <!-- Escenario de Detalle de Prenda -->
    <section class="product-detail-section">
        <div class="product-detail-container">
            <div class="product-gallery">
                <div class="main-image-container">
                    <img id="main-product-img" src="" alt="Prenda">
                </div>
                <div class="thumbnail-grid" id="thumbnail-grid">
                    <!-- Miniaturas táctiles generadas por JS -->
                </div>
            </div>
            <div class="product-info-detail">
                <h1 id="prod-title">Cargando prenda...</h1>
                <p id="prod-price" class="price-tag">$0.00</p>
                <div class="detail-divider"></div>

                <div class="detail-item" style="margin-bottom: 1.8rem;">
                    <span style="font-size: 0.8rem; color: #86868b; text-transform: uppercase; font-weight: 600; letter-spacing: -0.12px; display: block; margin-bottom: 4px;">Detalles & Confección</span>
                    <p id="prod-desc" style="font-size: 0.95rem; color: #d1d1d6; line-height: 1.5;">Cargando descripción...</p>
                </div>

                <div class="order-configuration">
                    <div id="config-container">
                        <!-- Talla y Stepper de Cantidad generado dinámicamente -->
                    </div>
                </div>

                <div class="total-section" style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08);">
                    <div>
                        <span style="color: #86868b; font-size: 0.85rem; display: block;">Prendas seleccionadas</span>
                        <strong style="color: #f5f5f7; font-size: 1rem;" id="total-count">1 (S)</strong>
                    </div>
                    <div style="text-align: right;">
                        <span style="color: #86868b; font-size: 0.85rem; display: block;">Total estimado</span>
                        <strong style="color: #0071e3; font-size: 1.35rem; letter-spacing: -0.28px;" id="total-price">$0</strong>
                    </div>
                </div>

                <button id="btn-add-cart" class="btn-primary" style="width: 100%; margin-top: 1.8rem; font-size: 1rem; padding: 14px 28px;">
                    Añadir al Carrito
                </button>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <h3>AnimeCostura</h3>
            <p>Alta confección streetwear inspirada en el anime.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../storage.js"></script>
    <script src="product-detail.js"></script>
    <script src="../nav-roles.js"></script>
</body>
</html>
