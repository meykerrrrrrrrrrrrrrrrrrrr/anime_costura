<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura - Mi Perfil</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Permanent+Marker&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease;
        }
        .profile-container {
            max-width: 900px;
            margin: 5rem auto;
            padding: 0;
            background: var(--white);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 4px solid var(--primary);
            position: relative;
            z-index: 2;
        }
        .profile-banner {
            height: 250px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .profile-banner img, .profile-banner video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(transparent, rgba(0,0,0,0.5));
            z-index: 2;
        }
        /* Fondo de pantalla completa */
        #full-page-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            object-fit: cover;
            display: none;
        }
        .profile-content {
            padding: 3rem;
            text-align: center;
            position: relative;
            margin-top: -70px;
        }
        .profile-avatar-container {
            position: relative;
            display: inline-block;
            z-index: 3;
        }
        .profile-avatar {
            width: 150px;
            height: 150px;
            background: var(--white);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            margin: 0 auto 1.5rem;
            border: 8px solid var(--white);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            font-family: 'Permanent Marker', cursive;
            object-fit: cover;
            overflow: hidden;
        }
        .edit-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: 0.3s;
            z-index: 10;
        }
        .edit-btn:hover { transform: scale(1.1); background: var(--secondary); }

        .user-info h2 {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }
        .badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--primary);
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 2rem;
        }
        .stat-card {
            padding: 2rem;
            background: var(--gray);
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: white;
        }
        .stat-card h4 {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .stat-card p {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'Permanent Marker', cursive;
        }
        .logout-btn {
            display: block;
            width: fit-content;
            margin: 3rem auto 0;
            padding: 1rem 2.5rem;
            background: var(--danger);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .logout-btn:hover {
            background: #d63031;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 118, 117, 0.4);
        }
        .customization-panel {
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 20px;
            margin-top: 3rem;
            border: 2px dashed var(--primary);
            display: none; /* Oculto por defecto */
        }
        .custom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        .custom-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .custom-item label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--secondary);
        }
        .custom-item input {
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .save-changes-btn {
            display: block;
            width: 100%;
            margin-top: 2rem;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .save-changes-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Elemento para fondo de pantalla completa con Overlay de Contraste -->
    <video id="full-page-bg-video" class="full-bg" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; object-fit:cover;"></video>
    <img id="full-page-bg-img" class="full-bg" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; object-fit:cover;">
    <div id="full-page-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; background: radial-gradient(circle at center, rgba(15,12,41,0.55) 0%, rgba(20,20,35,0.88) 100%); pointer-events:none;"></div>

    <header>
        <nav>
            <div class="logo">Anime<span>Costura</span></div>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="perfil.html" class="active">Mi Perfil</a></li>
            </ul>
        </nav>
    </header>

    <section class="profile-section">
        <div class="profile-container">
            <div class="profile-banner" id="banner-container">
                <div class="banner-overlay"></div>
            </div>
            <div class="profile-content">
                <div class="profile-avatar-container">
                    <div class="profile-avatar" id="user-avatar">U</div>
                    <button class="edit-btn" id="btn-toggle-edit" onclick="toggleEditMode()">✏️</button>
                </div>
                <div class="user-info">
                    <h2 id="user-name">Cargando...</h2>
                    <div id="user-status" class="badge">Usuario</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>Créditos</h4>
                        <p id="user-credits">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Compras</h4>
                        <p id="user-purchases">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Nivel</h4>
                        <p id="user-level">Nuevo</p>
                    </div>
                    <div class="stat-card">
                        <h4>Beneficios</h4>
                        <p id="user-benefits">Básico</p>
                    </div>
                </div>

                <div class="customization-panel" id="edit-panel">
                    <h3 style="font-family: 'Permanent Marker'; margin-bottom: 1.5rem; color: var(--primary);">Personaliza tu Perfil</h3>
                    <div class="custom-grid">
                        <div class="custom-item">
                            <label>Foto de Perfil</label>
                            <input type="file" id="upload-avatar" accept="image/*" style="display:none">
                            <button class="btn-secondary" onclick="document.getElementById('upload-avatar').click()">Seleccionar Foto</button>
                        </div>
                        <div class="custom-item">
                            <label>Barra Superior (Imagen/Video)</label>
                            <input type="file" id="upload-banner" accept="image/*,video/*">
                        </div>
                        <div class="custom-item">
                            <label>Fondo de Pantalla (Imagen/Video)</label>
                            <input type="file" id="upload-full-bg" accept="image/*,video/*">
                        </div>
                        <div class="custom-item">
                            <label>Posición del Recorte</label>
                            <select id="banner-position" style="padding: 0.5rem; border-radius: 8px; border: 1px solid #ddd;">
                                <option value="center">Centro</option>
                                <option value="top">Arriba</option>
                                <option value="bottom">Abajo</option>
                                <option value="left">Izquierda</option>
                                <option value="right">Derecha</option>
                            </select>
                        </div>
                        <div class="custom-item">
                            <label>Color del Perfil</label>
                            <input type="color" id="profile-color" value="#6c5ce7">
                        </div>
                    </div>
                    <!-- Galería de Ajustes Rápidos Anime -->
                    <div style="margin: 2rem 0; text-align: left; background: #fff; padding: 1.5rem; border-radius: 15px; border: 1px solid #e0e0e0;">
                        <h4 style="font-family: 'Permanent Marker'; color: var(--primary); margin-bottom: 0.8rem;">Fondos y Banners Anime Oficiales</h4>
                        <p style="font-size: 0.85rem; color: #666; margin-bottom: 1rem;">Selecciona una combinación predeterminada con un solo clic:</p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button type="button" class="btn-secondary" onclick="applyAnimePreset('video1')" style="font-size: 0.8rem; padding: 0.5rem 1rem; cursor:pointer;">🎬 Fondo Video Hero</button>
                            <button type="button" class="btn-secondary" onclick="applyAnimePreset('video2')" style="font-size: 0.8rem; padding: 0.5rem 1rem; cursor:pointer;">🎬 Fondo Video Taller</button>
                            <button type="button" class="btn-secondary" onclick="applyAnimePreset('marin')" style="font-size: 0.8rem; padding: 0.5rem 1rem; cursor:pointer;">🌸 Banner Marín Kitagawa</button>
                            <button type="button" class="btn-secondary" onclick="applyAnimePreset('musashi')" style="font-size: 0.8rem; padding: 0.5rem 1rem; cursor:pointer;">⚔️ Banner Miyamoto Musashi</button>
                            <button type="button" class="btn-secondary" onclick="applyAnimePreset('noir')" style="font-size: 0.8rem; padding: 0.5rem 1rem; cursor:pointer;">🖤 Fondo Noir 4K</button>
                        </div>
                    </div>

                    <button class="save-changes-btn" id="btn-save-profile">Guardar Cambios</button>
                </div>

                <button id="btn-logout" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </section>

    <script src="perfil.js"></script>
    <script src="../nav-roles.js"></script>
</body>
</html>
