<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura — Mi Perfil</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #f5f5f7;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .profile-container {
            max-width: 900px;
            margin: 4rem auto;
            background: #111111;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .profile-banner {
            height: 240px;
            background: #161616;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .profile-banner img, .profile-banner video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(transparent, #111111);
            z-index: 2;
        }
        .profile-content {
            padding: 3rem;
            text-align: center;
            position: relative;
            margin-top: -65px;
        }
        .profile-avatar-container {
            position: relative;
            display: inline-block;
            z-index: 3;
        }
        .profile-avatar {
            width: 130px;
            height: 130px;
            background: #111111;
            color: #f5f5f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 600;
            margin: 0 auto 1.2rem;
            border: 4px solid #111111;
            outline: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            object-fit: cover;
            overflow: hidden;
        }
        .edit-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            z-index: 10;
        }
        .edit-btn:hover { transform: scale(1.08); background: #0077ed; }

        .user-info h2 {
            font-size: 2rem;
            margin-bottom: 0.4rem;
            color: #f5f5f7;
            letter-spacing: -0.576px;
        }
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(0, 113, 227, 0.15);
            color: #0071e3;
            border: 1px solid rgba(0, 113, 227, 0.3);
            margin-bottom: 2rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 2rem;
        }
        .stat-card {
            padding: 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .stat-card h4 {
            font-size: 0.8rem;
            color: #86868b;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            letter-spacing: -0.12px;
        }
        .stat-card p {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f5f5f7;
            letter-spacing: -0.28px;
        }
        .logout-btn {
            display: block;
            width: fit-content;
            margin: 3rem auto 0;
            padding: 10px 24px;
            background: rgba(255, 48, 55, 0.15);
            color: #ff3037;
            border: 1px solid #ff3037;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .logout-btn:hover {
            background: #ff3037;
            color: white;
        }
        .customization-panel {
            background: rgba(255, 255, 255, 0.02);
            padding: 2rem;
            border-radius: 20px;
            margin-top: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
        .custom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .custom-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .custom-item label {
            font-size: 0.85rem;
            color: #86868b;
        }
        .custom-item input, .custom-item select {
            padding: 8px 12px;
            border-radius: 980px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #6e6e73;
            color: #f5f5f7;
        }
        .save-changes-btn {
            display: block;
            width: 100%;
            margin-top: 1.8rem;
            padding: 12px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <video id="full-page-bg-video" class="full-bg" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; object-fit:cover;"></video>
    <img id="full-page-bg-img" class="full-bg" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; object-fit:cover;">
    <div id="full-page-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, #000000 95%); pointer-events:none;"></div>

    <header>
        <nav>
            <div class="logo">Anime<span>Costura</span></div>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="perfil.html" class="active">Mi Perfil</a></li>
                <li><a href="carrito.html" class="cart-nav-link">🛒 Carrito</a></li>
            </ul>
        </nav>
    </header>

    <section class="profile-section">
        <div class="profile-container">
            <div class="profile-banner" id="banner-container">
                <div class="banner-overlay"></div>
            </div>
            <div class="profile-content">
                <div class="profile-avatar-container">
                    <div class="profile-avatar" id="user-avatar">U</div>
                    <button class="edit-btn" id="btn-toggle-edit" onclick="toggleEditMode()">✏️</button>
                </div>
                <div class="user-info">
                    <h2 id="user-name">Cargando...</h2>
                    <div id="user-status" class="badge">Usuario</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>Créditos</h4>
                        <p id="user-credits">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Compras</h4>
                        <p id="user-purchases">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Nivel</h4>
                        <p id="user-level">Nuevo</p>
                    </div>
                    <div class="stat-card">
                        <h4>Beneficios</h4>
                        <p id="user-benefits">Básico</p>
                    </div>
                </div>

                <div class="customization-panel" id="edit-panel">
                    <h3 style="margin-bottom: 1.5rem; color: #f5f5f7;">Personalizar Perfil</h3>
                    <div class="custom-grid">
                        <div class="custom-item">
                            <label>Foto de Perfil</label>
                            <input type="file" id="upload-avatar" accept="image/*" style="display:none">
                            <button class="btn-secondary" style="font-size: 13px; padding: 8px 16px;" onclick="document.getElementById('upload-avatar').click()">Seleccionar Foto</button>
                        </div>
                        <div class="custom-item">
                            <label>Barra Superior (Imagen/Video)</label>
                            <input type="file" id="upload-banner" accept="image/*,video/*">
                        </div>
                        <div class="custom-item">
                            <label>Fondo de Pantalla (Imagen/Video)</label>
                            <input type="file" id="upload-full-bg" accept="image/*,video/*">
                        </div>
                        <div class="custom-item">
                            <label>Posición del Recorte</label>
                            <select id="banner-position">
                                <option value="center">Centro</option>
                                <option value="top">Arriba</option>
                                <option value="bottom">Abajo</option>
                            </select>
                        </div>
                    </div>

                    <button class="save-changes-btn" id="btn-save-profile">Guardar Cambios</button>
                </div>

                <button id="btn-logout" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </section>

    <script src="perfil.js"></script>
    <script src="../nav-roles.js"></script>
</body>
</html>
