<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura — Tienda & Catálogo Oficial</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Anime<span>Costura</span></div>
            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="nosotros.html">Quiénes Somos</a></li>
                <li><a href="tienda.html" class="active">Tienda</a></li>
                <li><a href="inventario.html">Inventario</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="carrito.html" class="cart-nav-link">🛒 Carrito (<span id="nav-cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <!-- Fondo de Video Anime Fijo -->
    <div class="anime-page-bg">
        <video autoplay muted loop playsinline webkit-playsinline preload="auto">
            <source src="../assets/media/video-hero.mp4" type="video/mp4">
        </video>
        <div class="anime-bg-overlay"></div>
    </div>

    <!-- Banner Superior Estilo Apple Stage con Video Secundario -->
    <section class="anime-video-banner">
        <video autoplay muted loop playsinline webkit-playsinline preload="auto">
            <source src="../assets/media/video-secondary.mp4" type="video/mp4">
        </video>
        <div class="banner-overlay"></div>
        <div class="banner-content">
            <h2>Colección AnimeCostura</h2>
            <p>Diseños urbanos confeccionados con dedicación artesanal, inspirados en el arte manga y anime.</p>
            <div class="search-container">
                <input type="text" id="shop-search" placeholder="Buscar por personaje, prenda o estilo (ej: Gojo, Maki, Sukuna)...">
                <span class="search-icon">🔍</span>
            </div>
            <div style="margin-top: 1.2rem; display: flex; justify-content: center; gap: 12px;">
                <button id="btn-refresh-shop" class="btn-secondary" style="font-size: 13px; padding: 8px 18px;">
                    🔄 Sincronizar Catálogo
                </button>
            </div>
        </div>
    </section>

    <!-- Cuadrícula de Productos Apple Dark Stage -->
    <section class="products" style="background: transparent; padding-top: 3rem;">
        <div class="product-grid" id="product-display">
            <!-- Los productos se renderizan dinámicamente con estilo 28px card -->
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <h3>AnimeCostura</h3>
            <p>Alta confección streetwear inspirada en el anime.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../storage.js"></script>
    <script src="tienda.js"></script>
    <script src="../nav-roles.js"></script>
</body>
</html>
