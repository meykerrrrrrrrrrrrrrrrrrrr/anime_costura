<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura - Gestión de Pedidos</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Permanent+Marker&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .orders-container {
            max-width: 1200px;
            margin: 5rem auto;
            padding: 0 2rem;
        }
        .section-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 2rem;
        }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }
        .order-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid var(--primary);
            transition: 0.3s;
        }
        .order-card:hover { transform: translateY(-5px); }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .order-id { font-weight: bold; color: var(--primary); }
        .order-status {
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pendiente { background: #ffeaa7; color: #d35400; }
        .status-confirmado { background: #55efc4; color: #00b894; }

        .order-items {
            margin-bottom: 1rem;
        }
        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .item-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 5px;
        }
        .order-details {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .order-details p { margin: 0.3rem 0; }

        .btn-whatsapp {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background: #25D366;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-whatsapp:hover { background: #128C7E; transform: scale(1.02); }
        .btn-confirm {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Anime<span>Costura</span></div>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="pedidos.html" class="active">Pedidos</a></li>
            </ul>
        </nav>
    </header>

    <!-- Fondo de Video Anime Fijo -->
    <div class="anime-page-bg">
        <video autoplay muted loop playsinline>
            <source src="../assets/media/video-hero.mp4" type="video/mp4">
        </video>
        <div class="anime-bg-overlay"></div>
    </div>

    <section class="orders-container">
        <h2 class="section-title" style="color: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,0.8);">Gestión de Pedidos Recibidos</h2>
        <div id="orders-list" class="orders-grid">
            <!-- Pedidos cargados por JS -->
        </div>
    </section>

    <script src="../storage.js"></script>
    <script src="pedidos.js"></script>
    <script src="../nav-roles.js"></script>
</body>
</html>
