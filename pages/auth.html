<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura - Registro y Login</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Permanent+Marker&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Video de Fondo Anime */
        .auth-video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.65) contrast(1.1);
        }

        .auth-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 12, 41, 0.6) 0%, rgba(20, 20, 35, 0.9) 100%);
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        .auth-container {
            width: 90%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.8rem 2.5rem;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
            border: 3px solid var(--primary);
            animation: fadeIn 0.8s ease-out;
            position: relative;
            z-index: 10;
            margin: 2rem 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Combinación de Personajes en el Header de Auth */
        .auth-anime-combo {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.2rem;
        }

        .auth-anime-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.3s ease;
        }

        .auth-anime-avatar:hover {
            transform: scale(1.15);
        }

        .auth-anime-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .auth-tab {
            padding: 0.6rem 1.8rem;
            cursor: pointer;
            border-radius: 50px;
            background: #eee;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .auth-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.2rem;
        }
        .auth-form.active {
            display: flex;
        }
        .auth-form input {
            padding: 0.9rem 1.2rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            transition: 0.3s;
            outline: none;
            background: #fff;
        }
        .auth-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.25);
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: var(--secondary);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .logo-auth {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.3rem;
            margin-bottom: 0.3rem;
            color: var(--secondary);
            text-transform: uppercase;
        }
        .logo-auth span {
            color: var(--primary);
        }
        .back-home-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-home-link:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-container {
                width: 94%;
                padding: 1.8rem 1.2rem;
                margin: 1.5rem auto;
                border-radius: 20px;
            }
            .logo-auth {
                font-size: 1.9rem;
            }
            .auth-form input {
                font-size: 16px;
                padding: 0.8rem 1rem;
            }
            .btn-submit {
                font-size: 1.05rem;
                padding: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Video de Fondo Anime con Overlay -->
    <video autoplay muted loop playsinline class="auth-video-bg">
        <source src="../assets/media/video-hero.mp4" type="video/mp4">
    </video>
    <div class="auth-bg-overlay"></div>

    <div class="auth-container">
        <!-- Combinación de los 3 Universos Anime -->
        <div class="auth-anime-combo">
            <div class="auth-anime-avatar" title="Kitagawa Marín - Moda y Cosplay">
                <img src="../assets/media/marin.jpg" alt="Kitagawa Marin">
            </div>
            <div class="auth-anime-avatar" title="Miyamoto Musashi - Disciplina Ronin">
                <img src="../assets/media/musashi.jpg" alt="Miyamoto Musashi">
            </div>
            <div class="auth-anime-avatar" title="Estética Noir 4K">
                <img src="../assets/media/wallpaper-bw.jpg" alt="Wallpaper Noir">
            </div>
        </div>

        <div class="logo-auth">Anime<span>Costura</span></div>
        <p style="margin-bottom: 1.8rem; font-weight: 600; color: #555; font-size: 0.95rem;">Accede a tu cuenta Otaku</p>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login">Login</div>
            <div class="auth-tab" id="tab-register">Registro</div>
        </div>

        <!-- Formulario de Login -->
        <form id="login-form" class="auth-form active">
            <input type="text" id="login-doc" placeholder="Número de Documento" required>
            <input type="password" id="login-pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-submit">¡Entrar!</button>
        </form>

        <!-- Formulario de Registro -->
        <form id="register-form" class="auth-form">
            <input type="text" id="reg-name" placeholder="Nombre Completo" required>
            <input type="text" id="reg-doc" placeholder="Número de Documento" required>
            <input type="text" id="reg-whatsapp" placeholder="Número de WhatsApp" required>
            <input type="password" id="reg-pass" placeholder="Crea una Contraseña" required>
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <a href="../index.html" class="back-home-link">← Volver a la página principal</a>
    </div>
    <script src="auth.js"></script>
</body>
</html>
