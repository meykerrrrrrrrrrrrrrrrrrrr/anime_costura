<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeCostura — Acceso & Registro</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .auth-video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
            opacity: 0.35;
        }

        .auth-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, #000000 95%);
            z-index: -1;
        }

        .auth-container {
            width: 90%;
            max-width: 440px;
            background: #111111;
            padding: 3rem 2.5rem;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            position: relative;
            z-index: 10;
            margin: 2rem 0;
        }

        .auth-anime-combo {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .auth-anime-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease;
        }

        .auth-anime-avatar:hover {
            transform: scale(1.1);
        }

        .auth-anime-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-tab {
            flex: 1;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 9999px;
            background: transparent;
            color: #86868b;
            font-weight: 500;
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s;
            border: none;
        }

        .auth-tab.active {
            background: #0071e3;
            color: #ffffff;
            font-weight: 600;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.2rem;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form input {
            padding: 12px 20px;
            border: 1px solid #6e6e73;
            border-radius: 980px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: #f5f5f7;
            transition: border-color 0.2s;
        }

        .auth-form input:focus {
            border-color: #0071e3;
        }

        .btn-submit {
            background: #0071e3;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #0077ed;
            transform: scale(1.01);
        }

        .logo-auth {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
            color: #f5f5f7;
            text-transform: uppercase;
        }

        .logo-auth span {
            color: #0071e3;
        }

        .back-home-link {
            display: inline-block;
            margin-top: 1.8rem;
            color: #86868b;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-home-link:hover {
            color: #f5f5f7;
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline class="auth-video-bg">
        <source src="../assets/media/video-hero.mp4" type="video/mp4">
    </video>
    <div class="auth-bg-overlay"></div>

    <div class="auth-container">
        <div class="auth-anime-combo">
            <div class="auth-anime-avatar" title="Kitagawa Marín">
                <img src="../assets/media/marin.jpg" alt="Kitagawa Marin">
            </div>
            <div class="auth-anime-avatar" title="Miyamoto Musashi">
                <img src="../assets/media/musashi.jpg" alt="Miyamoto Musashi">
            </div>
            <div class="auth-anime-avatar" title="Estética Noir">
                <img src="../assets/media/wallpaper-bw.jpg" alt="Wallpaper Noir">
            </div>
        </div>

        <div class="logo-auth">Anime<span>Costura</span></div>
        <p style="margin-bottom: 1.8rem; color: #86868b; font-size: 0.9rem;">Accede a tu cuenta de alta costura anime</p>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">Iniciar Sesión</button>
            <button type="button" class="auth-tab" id="tab-register">Crear Cuenta</button>
        </div>

        <!-- Formulario de Login -->
        <form id="login-form" class="auth-form active">
            <input type="text" id="login-doc" placeholder="Número de Documento" required>
            <input type="password" id="login-pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <!-- Formulario de Registro -->
        <form id="register-form" class="auth-form">
            <input type="text" id="reg-name" placeholder="Nombre Completo" required>
            <input type="text" id="reg-doc" placeholder="Número de Documento" required>
            <input type="text" id="reg-whatsapp" placeholder="WhatsApp / Teléfono" required>
            <input type="password" id="reg-pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-submit">Registrarme</button>
        </form>

        <a href="../index.html" class="back-home-link">← Volver al inicio</a>
    </div>
    <script src="auth.js"></script>
</body>
</html>
